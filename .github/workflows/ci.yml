name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting and linter
        run: npm run lint

      - name: Run test suite
        run: npm test
        env:
          EMAIL_PROVIDER: resend
          EMAIL_API_KEY: re_mock_ci_key
          EMAIL_FROM: Dose <onboarding@resend.dev>
          ANTHROPIC_API_KEY: sk-ant-mock-key
          CLAUDE_MODEL: claude-opus-5-5
          GROQ_API_KEY: gsk_mock_ci_key
          SUPABASE_URL: https://fsoxehtneqjgrbrsqhqr.supabase.co
          SUPABASE_ANON_KEY: mock_anon_key

      - name: Build Next.js application
        run: npm run build
        env:
          CLAUDE_MODEL: claude-opus-5-5
          GROQ_TRANSCRIPTION_MODEL: whisper-large-v3-turbo

